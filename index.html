<title>Al Salam Hospitals - Lab Inventory</title>
<style>
:root{--teal:#0e6b7a;--teal2:#e3f1f3;--navy:#17325c;--bg:#f3f6f9;--card:#fff;--red:#c0392b;--amber:#d98200;--ok:#1e8449;--line:#dde5ec;--ink:#1c2733;--mut:#667789;--r:14px;--sh:0 1px 2px #0b1f3a14,0 4px 14px #0b1f3a0d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.ico{flex:none;vertical-align:middle}
select,input,button{font:inherit;color:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:42px}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:disabled{opacity:.55;cursor:default}
button.p{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
button.d{background:#fff;color:var(--red);border-color:#f0c4be}
.rks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}.rk{background:#fff;border:1px solid #dfe6ee;border-radius:12px;padding:10px 12px}.rk b{display:block;font-size:22px;color:#12305c}.rk span{font-size:12px;color:#52627a}
.chartbox{background:#fff;border:1px solid #dfe6ee;border-radius:12px;padding:10px;margin:6px 0 12px}.chartbox .lg{font-size:13px;margin-bottom:6px;font-weight:600}
.tw{overflow-x:auto}.rpt h3{margin:18px 0 6px}.rpt h4{margin:12px 0 4px;color:#33445c}.rpt tfoot th{background:#eef3f7}
@media print{.rpt h3{break-after:avoid}.rpt table{font-size:11px}.rpt tr,.chartbox,.rk{break-inside:avoid}.tw{overflow:visible}.rk{border:1px solid #999}@page{margin:12mm}}
#toast{position:fixed;inset-inline:12px;bottom:90px;z-index:50;display:none;background:#12305c;color:#fff;border-radius:12px;padding:12px 14px;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-weight:600}#toast.on{display:flex}#toast button{background:#fff;color:#12305c;border:0;border-radius:8px;padding:8px 14px;font-weight:700;min-height:40px}
.big1{flex:1;min-height:52px;font-size:17px;font-weight:700}.ic-a2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
button.s{padding:6px 10px;font-size:13px;min-height:34px;border-radius:9px}
button.s.p{font-weight:600}
/* top bar */
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px}
.top .logo{height:34px}
.top h1{margin:0;font-size:18px;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.top select{flex:1;min-width:0;font-weight:600;color:var(--navy);padding:8px 10px;min-height:38px}
.top h1{display:none}.top .lg{padding:8px 10px}.top .lg .lt{display:none}.who{display:none}
#bellb{padding:8px 10px}
.top .lg{padding:8px 12px;min-height:38px;font-weight:600}
.who{font-size:12px;color:var(--mut);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebrand{display:none}
/* nav */
nav#nav{position:fixed;z-index:20;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px #0b1f3a12}
nav#nav button{flex:1;flex-direction:column;border:0;background:none;min-height:56px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--mut);gap:3px;border-radius:12px}
nav#nav button.on{color:var(--teal);background:var(--teal2)}
main{max-width:1100px;margin:0 auto;padding:14px}
/* cards & lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:auto}
.pad{padding:14px}
.sec-h{margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.bar .grow{flex:1;min-width:150px}
.sbox{position:relative;flex:1;min-width:160px}
.sbox .ico{position:absolute;inset-inline-start:11px;top:11px;color:var(--mut)}
.sbox input{width:100%;padding-inline-start:38px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;text-align:start;min-height:70px}
.kpi .n{font-size:24px;font-weight:800;color:var(--navy);line-height:1}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .bub{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--teal2);color:var(--teal);flex:none}
.kpi.warn .bub{background:#fdecea;color:var(--red)}.kpi.warn .n{color:var(--red)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{flex-direction:column;min-height:74px;font-weight:600;font-size:13px;color:var(--teal);background:#fff;box-shadow:var(--sh);border-radius:var(--r)}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
.ic{background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--ok);border-radius:var(--r);padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.ic.exp{border-inline-start-color:var(--red)}.ic.soon{border-inline-start-color:var(--amber)}.ic.low{border-inline-start-color:#8e44ad}
.ic-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ic-n{font-weight:700;font-size:16px}
.ic-m{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-size:24px;font-weight:800;color:var(--navy)}
.ic-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.bc{display:flex;flex-direction:row;gap:12px}
.bc .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bc.res{background:#eef3ff;border-color:#bcd0ff}.bc.rec{background:#f0f2f4;color:#667}
.bc.red{background:#fff1ef;border-color:#f3b9b2}.bc.yel{background:#fff8e3;border-color:#f2d98a}
.bname{font-weight:800;font-size:17px;color:var(--navy)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.muted{color:var(--mut);font-size:13px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;font-weight:600;white-space:nowrap;display:inline-block}
.tag.exp{background:var(--red)}.tag.soon{background:var(--amber)}.tag.low{background:#8e44ad}.tag.ok{background:var(--ok)}
.chipsrow{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.chipsrow button{border-radius:99px;padding:6px 14px;min-height:36px;font-size:13px;white-space:nowrap}
.chipsrow button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:flex;background:#e6ecf1;border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;font-weight:600;color:var(--mut);border-radius:10px;min-height:38px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.lrow{display:flex;width:100%;justify-content:flex-start;gap:12px;padding:14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:#fff;font-weight:600;min-height:54px}
.lrow span{flex:1;text-align:start}.lrow:last-child{border-bottom:0}
.ctl{display:none;margin-bottom:14px;padding:14px;gap:8px;flex-wrap:wrap}
body[data-tab=more] .ctl{display:flex}
.ctl button{flex:1;min-width:150px}
.al{padding:10px 12px;border-radius:12px;margin:0 0 8px;color:#fff;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.al.exp{background:var(--red)}.al.soon{background:var(--amber)}.al.low{background:#8e44ad}.al.sum{background:var(--navy);cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{background:#eef3f6;font-size:12.5px}
dialog{border:0;border-radius:18px;padding:18px;max-width:540px;width:94%;max-height:92vh;overflow:auto}
dialog::backdrop{background:#0a1a2f80}
dialog h3{margin-top:0;color:var(--navy)}
label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mut);font-weight:600}
dialog input,dialog select{width:100%}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row button{flex:1}
video{width:100%;border-radius:10px;background:#000}
.ptypes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ptc{flex-direction:column;padding:10px 4px;min-height:98px;font-size:12.5px;font-weight:600;line-height:1.2;text-align:center;border-radius:12px;border:2px solid var(--line)}
.ptc.on{border-color:var(--teal);background:var(--teal2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:58px;border-radius:99px;font-weight:700;border:2px solid var(--line)}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.ph{display:none}
@media(min-width:620px){.top h1{display:flex}.top select{flex:none;max-width:260px}.top .lg .lt{display:inline}.who{display:inline-block}.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}.kpi{flex-direction:column;align-items:flex-start}}
@media(min-width:900px){
 body{padding-bottom:0;padding-inline-start:230px}
 .sidebrand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
 .sidebrand img{height:38px;max-width:60px;object-fit:contain}.sidebrand b{color:var(--navy);font-size:14px;line-height:1.2}
 aside.side{position:fixed;inset-block:0;inset-inline-start:0;width:230px;background:#fff;z-index:20;border-inline-end:1px solid var(--line)}
 nav#nav{position:static;flex-direction:column;border:0;box-shadow:none;padding:6px 10px;gap:4px}
 nav#nav button{flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;font-size:14.5px;padding:8px 12px}
 .top .logo{display:none}
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
@media print{aside.side,.top,.ctl,.seg,.chipsrow,#alerts,.noprint,nav{display:none!important}body{padding:0!important;background:#fff}.ph{display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;margin-bottom:10px}.ph img{height:60px}.card{border:0;box-shadow:none}}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;margin:8px 0;cursor:pointer;text-align:center}
#dlg label.pbtn{display:flex!important;align-items:center;justify-content:center;gap:8px;min-height:50px;margin:8px 0!important;padding:8px 12px;border:1.5px solid #0e6b77!important;border-radius:12px!important;background:#e3f1f2!important;color:#0e6b77!important;font-weight:700!important;font-size:15px!important;cursor:pointer;text-align:center}
</style>
<style>
#auth{position:fixed;inset:0;z-index:2000;background:#eef3f8;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#auth[hidden]{display:none}
#auth .box{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%;box-shadow:0 6px 30px #0b2a4a30}
#auth img{height:auto;width:200px;max-width:80%;display:block;margin:0 auto 10px}
#auth h2{margin:4px 0 14px;color:var(--navy);text-align:center;font-size:20px}
#auth input{width:100%;margin-bottom:10px}
#auth .err{background:#fde8e8;color:#9b1c1c;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
#auth .ok{background:#e3f6ea;color:#14623a;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
#auth button.p{width:100%;min-height:48px}
#auth .lnk{background:none;border:0;color:#0e6b77;text-decoration:underline;padding:8px;min-height:0;width:100%}
#syncerr{display:none;background:#fff4e0;color:#8a4b00;border:1px solid #f0c987;border-radius:10px;padding:9px 12px;margin:0 0 10px;font-size:13px}
.pk{position:relative;width:100%}.pkTop{width:auto;flex:1;min-width:0;max-width:260px}
.pkb{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;min-height:46px;padding:10px 14px;border:2px solid #0e6b77;border-radius:12px;background:#fff;color:#12305c;font:inherit;font-weight:600;text-align:start;cursor:pointer;touch-action:manipulation}
.pkb .pkt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pkb .pkc{color:#0e6b77;font-size:18px}.pkb.open{background:#e3f1f2}
.pkl{background:#fff;border:2px solid #0e6b77;border-radius:12px;margin-top:6px;max-height:60vh;overflow:auto;box-shadow:0 6px 18px #0b2a4a30}
.pkTop .pkl{position:absolute;z-index:60;top:100%;inset-inline-start:0;min-width:240px}
.pko{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:start;padding:14px 16px;min-height:52px;border:0;border-bottom:1px solid #e3e9f0;background:#fff;color:#12305c;font:inherit;touch-action:manipulation;cursor:pointer}
.pko.on{background:#e3f1f2;color:#0e6b77;font-weight:700}
.bar .pk{flex:1;min-width:170px;width:auto}
#sheet{border:0;padding:0;margin:auto 0 0 0;width:100%;max-width:100%;border-radius:18px 18px 0 0;max-height:75vh;overflow:auto;background:#fff;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
#sheet::backdrop{background:rgba(10,20,40,.45)}
#sheet .sh{padding:14px 16px;font-weight:700;color:#12305c;border-bottom:1px solid #e3e9f0;position:sticky;top:0;background:#fff}
#sheet button.opt{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:start;padding:16px;min-height:54px;border:0;border-bottom:1px solid #eef2f6;border-radius:0;background:#fff;font-size:16px;font-weight:600;color:#1b2a41}
#sheet button.opt.on{background:#e3f1f2;color:#0e6b77}
</style>

function reportData(){
 const bs=repBranch==="both"?Object.keys(BRANCHES):[repBranch];const m=repMonth;const td=localToday();
 const [Y,M]=m.split("-").map(Number);const nd=new Date(Y,M,0).getDate();const days=[];for(let i=1;i<=nd;i++)days.push(m+"-"+String(i).padStart(2,"0"));
 const ms=Object.values(S.moves).filter(x=>bs.includes(x.branch)&&ldate(x.ts).slice(0,7)===m).sort((a,b)=>a.ts.localeCompare(b.ts));
 const items=Object.values(S.items).filter(i=>bs.includes(i.branch));
 const rows={};const row=id=>{const it=S.items[id]||{};return rows[id]=rows[id]||{id,name:it.name||"?",branch:it.branch,section:it.section,unit:it.unit||"",recv:0,issued:0,expired:0,cur:0,del:!!it.del}};
 const used={},expd={},inn={};days.forEach(d=>{used[d]=0;expd[d]=0;inn[d]=0});
 ms.forEach(x=>{const r=row(x.item);r.branch=r.branch||x.branch;const d=ldate(x.ts);if(x.type==="undo-issue"){r.issued-=x.delta;used[d]-=x.delta}else if(x.type==="undo-recv"){r.recv-=-x.delta;inn[d]-=-x.delta}else if(x.delta>0){r.recv+=x.delta;inn[d]+=x.delta}else if(x.type==="issue"){r.issued+=-x.delta;used[d]+=-x.delta}});
 const expList=[];
 items.forEach(i=>{if(i.del)return;if(i.expiry&&i.expiry.slice(0,7)===m&&i.expiry<=td){const q=Object.values(S.moves).reduce((a,x)=>x.item===i.id&&ldate(x.ts)<=i.expiry?a+x.delta:a,0);if(q>0){const r=row(i.id);r.expired=q;expd[i.expiry]+=q;expList.push({i,q})}}});
 const mEnd=days[days.length-1];const clos={};Object.values(S.moves).forEach(x=>{if(ldate(x.ts)<=mEnd)clos[x.item]=(clos[x.item]||0)+x.delta});
 Object.values(rows).forEach(r=>{r.cur=S.items[r.id]&&!r.del?(clos[r.id]||0):0});
 /* items with stock but no movement this month still appear in current stock totals */
 let curTotal=0;items.forEach(i=>{if(!i.del)curTotal+=Math.max(0,clos[i.id]||0)});
 const list=Object.values(rows).sort((a,b)=>a.name.localeCompare(b.name));
 const secs={};list.forEach(r=>{const k=r.section||"-";const s=secs[k]=secs[k]||{id:k,recv:0,issued:0,expired:0,cur:0};s.recv+=r.recv;s.issued+=r.issued;s.expired+=r.expired;s.cur+=Math.max(0,r.cur)});
 items.forEach(i=>{if(i.del)return;const k=i.section||"-";if(!secs[k])secs[k]={id:k,recv:0,issued:0,expired:0,cur:0};if(!rows[i.id])secs[k].cur+=Math.max(0,clos[i.id]||0)});
 const tot={recv:list.reduce((a,r)=>a+r.recv,0),issued:list.reduce((a,r)=>a+r.issued,0),expired:list.reduce((a,r)=>a+r.expired,0)};
 /* blood bank activity for the same month and branch selection */
 const sv=[brMonth,brBranch];brMonth=repMonth;brBranch=repBranch;let bd;try{bd=bRepData()}finally{brMonth=sv[0];brBranch=sv[1]}
 const bexp=Object.values(S.blood).filter(x=>!x.del&&bs.includes(x.branch)&&x.expiry&&x.expiry.slice(0,7)===m&&x.expiry<=td&&bState(x.id).st!=="received");
 const bc={reserve:0,cancel:0,auto:0,receive:0};bd.hist.forEach(h=>{if(bc[h.type]!==undefined)bc[h.type]++});
 return{days,used,expd,inn,ms,list,secs,tot,curTotal,expList,bd,bexp,bc,usedItems:list.filter(r=>r.issued>0).length,bs}}
const minMonth=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-18);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
function lineChart(days,series,mode){
 const W=680,H=230,L=40,R=12,Tp=14,B=34,pw=W-L-R,ph=H-Tp-B;
 const data=series.map(s=>{let a=0;return{...s,v:days.map(d=>mode==="cum"?(a+=s.map[d]):s.map[d])}});
 const mx=Math.max(1,...data.flatMap(s=>s.v));const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(mx)));return Math.ceil(mx/p)*p})();
 const X=i=>L+(days.length<2?0:i*pw/(days.length-1)),Y=v=>Tp+ph-(v/nice)*ph;
 let g="";for(let k=0;k<=4;k++){const v=nice*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#d7dee6"/><text x="${L-5}" y="${y+4}" font-size="11" text-anchor="end" fill="#52627a">${Math.round(v*10)/10}</text>`}
 days.forEach((d,i)=>{const n=i+1;if(n===1||n%5===0||n===days.length)g+=`<text x="${X(i)}" y="${H-14}" font-size="11" text-anchor="middle" fill="#52627a">${n}</text>`});
 g+=`<text x="${L+pw/2}" y="${H-1}" font-size="11" text-anchor="middle" fill="#52627a">${t("rpDay")}</text>`;
 data.forEach(s=>{const pts=s.v.map((v,i)=>X(i)+","+Y(v)).join(" ");g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;s.v.forEach((v,i)=>{if(mode!=="cum"&&v>0)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${s.color}"/>`});if(mode==="cum"){const l=s.v.length-1;g+=`<circle cx="${X(l)}" cy="${Y(s.v[l])}" r="4" fill="${s.color}"/>`}});
 const lg=data.map((s,i)=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-inline-end:16px"><i style="width:18px;height:4px;background:${s.color};display:inline-block;border-radius:2px"></i>${s.label}</span>`).join("");
 return`<div class="chartbox"><div class="lg">${lg}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="max-width:100%;height:auto;display:block;direction:ltr">${g}</svg></div>`}

 const bn=r=>repBranch==="both"?`<td>${e(brName(r.branch))}</td>`:"";const bh=repBranch==="both"?`<th>${t("branchSel")}</th>`:"";

const live=()=>window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
const tmo=(p,ms)=>Promise.race([p,new Promise((_,n)=>setTimeout(()=>n(new Error("timeout")),ms))]);
async function decodeImageFile(file){
 const url=URL.createObjectURL(file);
 try{
  if("BarcodeDetector"in window){try{const bm=await createImageBitmap(file);const r=await tmo(new BarcodeDetector().detect(bm),2500);if(r.length)return r[0].rawValue}catch(e){}}
  const rd=zxReader();
  try{const r=await tmo(rd.decodeFromImageUrl(url),6000);if(r)return r.getText()}catch(e){}
  /* retry on a downscaled copy (large phone photos can fail) */
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  for(const mx of [1400,900,600]){const k=Math.min(1,mx/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
   try{const r=await tmo(rd.decodeFromImageUrl(c.toDataURL("image/png")),6000);if(r)return r.getText()}catch(e){}}
  return null}
 finally{URL.revokeObjectURL(url)}}

 let r;try{r=await fetch("https://identitytoolkit.googleapis.com/v1/"+path+"?key="+encodeURIComponent(apiKey()),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){const x=new Error("NET");x.code="NET";throw x}
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){const m=String((j.error&&j.error.message)||("HTTP "+r.status));const x=new Error(m);x.code=m.split(/[ :]/)[0];throw x}
 return j}
function authErr(e){const c=e.code||"";
 if(c==="NET")return t("aOff");
 if(["EMAIL_NOT_FOUND","INVALID_PASSWORD","INVALID_LOGIN_CREDENTIALS"].includes(c))return t("aBad");
 if(c==="USER_DISABLED")return t("aDis");
 if(c==="TOO_MANY_ATTEMPTS_TRY_LATER")return t("aMany");
 if(["OPERATION_NOT_ALLOWED","PASSWORD_LOGIN_DISABLED"].includes(c))return t("aNotOn");
 if(c==="INVALID_EMAIL"||c==="MISSING_EMAIL")return t("aBadMail");
 if(/API_KEY|API key/i.test(e.message))return t("aBadKey");
 return e.message}

function signOut(msg){A=null;saveAuth();showAuth(msg||"")}
async function getToken(){
 if(!authReq())return"";
 if(!A||!A.refresh)throw Object.assign(new Error("signed out"),{code:"OUT"});
 if(A.id&&A.exp>Date.now()+60000)return A.id;
 let r;try{r=await fetch("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(apiKey()),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(A.refresh)})}catch(e){throw Object.assign(new Error("No internet"),{code:"NET"})}
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){const m=String((j.error&&j.error.message)||"");const c=m.split(/[ :]/)[0];
  if(["TOKEN_EXPIRED","USER_DISABLED","USER_NOT_FOUND","INVALID_REFRESH_TOKEN","INVALID_GRANT_TYPE","MISSING_REFRESH_TOKEN"].includes(c)){signOut(c==="USER_DISABLED"?t("aDis"):t("aEnded"));throw Object.assign(new Error("signed out"),{code:"OUT"})}
  throw Object.assign(new Error(m||("HTTP "+r.status)),{code:c||"HTTP"})}
 A.id=j.id_token;A.refresh=j.refresh_token||A.refresh;A.exp=Date.now()+(+j.expires_in||3600)*1000;saveAuth();return A.id}
function syncBar(){const el=document.getElementById("syncerr");if(!el)return;
 if(failN>=2&&syncMsg){el.style.display="block";el.textContent=t("aSync")+": "+syncMsg.replace(/^Error: /,"")+" "+t("aSafe")}else el.style.display="none"}

/* ---------- owner-managed users. Access = login exists AND uid listed under /allowed (owner-only in the database rules). ---------- */
async function usersDlg(msg,kind){let list="";let err="";
 try{const r=await dbf(P.sync+"/allowed.json");if(r.ok){const j=await r.json()||{};const ks=Object.keys(j);list=ks.length?ks.map(k=>`<div class="row" style="justify-content:space-between;align-items:center"><span><b>${esc(j[k].name||"")}</b><br><span class="muted">${esc(j[k].email||"")}</span></span><button data-a="rmuser" data-id="${esc(k)}">${t("uRm")}</button></div>`).join(""):`<p class="muted">${t("uEmpty")}</p>`}else if(r.status===401||r.status===403)err=t("uOwner");else err="HTTP "+r.status}catch(e){err=e.code==="DENIED"?t("uOwner"):authErr(e)}
 dlgOpen(`<h3>${t("uTitle")}</h3>${msg?`<div class="${kind==="ok"?"ok":"err"}" style="padding:10px;border-radius:10px;margin:6px 0;background:${kind==="ok"?"#e3f6ea":"#fde8e8"}">${esc(msg)}</div>`:""}${err?`<div style="padding:10px;border-radius:10px;margin:6px 0;background:#fde8e8">${esc(err)}</div>`:""}<label>${t("uName")}</label><input id="nu_name" autocomplete="off"><label>${t("aEmail")}</label><input id="nu_mail" type="email" autocapitalize="off" autocomplete="off"><label>${t("uPass")}</label><input id="nu_pass" type="text" autocapitalize="off" autocomplete="off"><div class="row"><button class="p" data-a="adduser">${t("uMake")}</button><button data-a="close">${t("uClose")}</button></div><h4>${t("uList")}</h4>${list}`)}
async function addUser(){const nm=nu_name.value.trim(),em=nu_mail.value.trim(),pw=nu_pass.value;
 if(!nm||!/^\S+@\S+\.\S+$/.test(em)||pw.length<6){usersDlg(t("uShort"));return}
 let uid="";
 try{try{const j=await idt("accounts:signUp",{email:em,password:pw,returnSecureToken:false});uid=j.localId}
  catch(e){if(e.code==="EMAIL_EXISTS"){try{const j=await idt("accounts:signInWithPassword",{email:em,password:pw,returnSecureToken:true});uid=j.localId}catch(x){usersDlg(t("uExists"));return}}else throw e}
 }catch(e){const c=e.code||"";usersDlg(c==="OPERATION_NOT_ALLOWED"||c==="ADMIN_ONLY_OPERATION"?t("uOff"):c==="WEAK_PASSWORD"?t("uWeak"):authErr(e));return}
 try{const r=await dbf(P.sync+"/allowed/"+uid+".json",{method:"PUT",body:JSON.stringify({name:nm,email:em,at:Date.now(),by:A.email})});if(!r.ok)throw Object.assign(new Error("HTTP "+r.status),{code:r.status===401||r.status===403?"DENIED":"HTTP"});usersDlg(t("uDone"),"ok")}
 catch(e){usersDlg(t("uPart")+(e.code==="DENIED"?t("uOwner"):e.message))}}
async function rmUser(id){try{const r=await dbf(P.sync+"/allowed/"+id+".json",{method:"DELETE"});if(!r.ok)throw Object.assign(new Error("HTTP "+r.status),{code:"DENIED"});usersDlg(t("uRmNote"),"ok")}catch(e){usersDlg(e.code==="DENIED"?t("uOwner"):e.message)}}
/* ---------- sync (last-write-wins per record; stock is a ledger of immutable moves, so quantities never conflict) ---------- */
function mergeIn(r){["items","sections","blood"].forEach(k=>{S[k]=S[k]||{};Object.values(r[k]||{}).forEach(v=>{const c=S[k][v.id];if(!c||(v.at||0)>(c.at||0))S[k][v.id]=v})});Object.values(r.moves||{}).forEach(m=>{S.moves[m.id]=m});S.bevents=S.bevents||{};Object.values(r.bevents||{}).forEach(m=>{S.bevents[m.id]=m});if(!P.cl2)cleanupTest()}
let syncing=false,failN=0;
async function dbf(url0,opts,retry){const tok=await getToken();const u=url0+(tok?"?auth="+encodeURIComponent(tok):"");let r;
 try{r=await fetch(u,opts)}catch(e){throw Object.assign(new Error("No internet / cannot reach the database"),{code:"NET"})}
 if((r.status===401||r.status===403)&&tok){if(!retry&&A){A.exp=0;return dbf(url0,opts,true)}throw Object.assign(new Error(t("aDenied")),{code:"DENIED"})}
 if(r.status===401||r.status===403)throw Object.assign(new Error("HTTP "+r.status+" (database rules block access)"),{code:"DENIED"});
 return r}
async function sync(){if(!P.sync||syncing||locked())return;syncing=true;
 try{const u=P.sync+"/lab.json";const r=await dbf(u);if(!r.ok)throw new Error("HTTP "+r.status);const remote=await r.json();if(remote)mergeIn(remote);if(!P.cl2){P.cl2=1;if(cleanupTest())save()}
  const w=await dbf(u,{method:"PUT",body:JSON.stringify(S)});if(!w.ok)throw new Error("HTTP "+w.status);syncMsg="OK "+new Date().toLocaleTimeString();failN=0;save();render();syncBar()}
 catch(e){if(e.code==="OUT"){syncMsg="Error: "+t("aEnded")}else{syncMsg="Error: "+e.message;failN++}syncBar();if(tab==="settings")render()}finally{syncing=false}}
setInterval(sync,10000);
/* ---------- start ---------- */
function boot(){if(!P.safe1){S.sections.safety=S.sections.safety||{id:"safety",en:"Safety",ar:"السلامة",at:Date.now()};P.safe1=1;save()}
if(!P.cl2&&cleanupTest())save();render();if(!P.user)dlgOpen(`<h3>${t("welcome")}</h3><label>${t("who")}</label><input id="u_name"><div class="row"><button class="p" data-a="setuser">${t("start")}</button></div>`);sync()}
function start(){if(locked()){showAuth(P.authMsg||"");return}boot()}
document.addEventListener("click",e=>{if(e.target.dataset.a==="setuser"){const v=u_name.value.trim();if(!v)return;P.user=v;save();dlg.close();render()}});
dlg.addEventListener("close",()=>{if(stream||scanTimer){clearInterval(scanTimer);if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}}});
dlg.addEventListener("cancel",e=>{if(!P.user)e.preventDefault()});
start();
